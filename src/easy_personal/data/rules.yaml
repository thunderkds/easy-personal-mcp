# v1 usage rule pack (PRD FR-026). One line per rule; core/rules.py reads it without a YAML library.
# Keys: metric, op (lt|gt: the rule fires when measured is lt/gt threshold), threshold, label
# (improve|aware|warning), priority (1 = first), window_days (look-back), min_history_days (less
# stored history than this -> the rule abstains), then title (plain name), why (one sentence: why it
# matters) and steps (1-3 actions separated by `|`), last. Each of these three runs to the next key.
# Thresholds are overridden in ~/.easy-personal/config.yaml under `thresholds:`.
rules:
  cache_hit_low: metric=cache_hit_ratio op=lt threshold=0.5 label=warning priority=1 window_days=7 min_history_days=7 title=Low cache reuse why=A prompt read from cache costs far less and returns faster, so a low share means you pay full price for text Claude has already seen. steps=Keep the start of your prompts the same from one turn to the next.|Avoid editing CLAUDE.md or switching models in the middle of a session.
  session_huge_no_compact: metric=median_session_context op=gt threshold=150000 label=improve priority=2 window_days=7 min_history_days=7 title=Sessions grow too large why=Every turn re-sends the whole conversation, so a very long session makes each reply slower and more expensive. steps=Run /compact when a session grows long.|Start a new session before the context passes 150k tokens.
  records_unreadable: metric=unreadable_share op=gt threshold=0.02 label=aware priority=2 window_days=7 min_history_days=0 title=Some Claude Code records are unreadable why=Records the parser cannot read are left out of every number you see, so the totals are too low. steps=Update easy-personal to the latest version.|If it stays high, tell the easy-personal maintainer which Claude Code version writes the records.
  tokens_jump: metric=week_over_week_tokens op=gt threshold=0.5 label=aware priority=3 window_days=7 min_history_days=14 title=Token use jumped why=A sudden rise is easy to miss and quickly becomes the new normal, along with its cost. steps=Open Usage and find which project or session drove the rise.|Decide if the rise is intended before it becomes your baseline.
  project_dominates: metric=top_project_share op=gt threshold=0.6 label=aware priority=3 window_days=7 min_history_days=7 title=One project uses most of your tokens why=A single project that crowds out the rest can hide waste, and your limit runs out sooner. steps=Confirm that this project should take most of your effort.|Split long-running work into shorter sessions.
  tool_errors_high: metric=kit_error_rate op=gt threshold=0.1 label=warning priority=2 window_days=7 min_history_days=0 title=Many tool calls fail why=Failed tool calls waste tokens and time because Claude retries and explains the error. steps=Read the failing tool calls in memory/event-trace/.|Fix the command or permission that keeps failing.
  context_index_stale: metric=context_stale_indexes op=gt threshold=0 label=improve priority=3 window_days=7 min_history_days=0 title=Code index is out of date why=Search in easy-context returns old results while its index is older than your latest commit. steps=Call `index_path` in easy-context for the listed projects.|You run it yourself; easy-personal never does.
