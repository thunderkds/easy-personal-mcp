[package]
name = "easy-personal-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Off by default: `cargo build` links no Tauri, GTK or WebKit crate, so `serve`, `mcp` and `store-info` need no display
# and no system library (the T050 keychain talks D-Bus in pure Rust: `keyring`'s `async-secret-service` over `zbus`). `--features window` adds the `app` window (needs the packages listed in spike-T001.md).
[features]
window = ["dep:tauri", "dep:tauri-build"]

# `src/keychain.rs` is the one library both binaries use (T078): it compiles once, and the launcher links it without the
# server. The library is that one file; it has no `lib.rs`.
[lib]
name = "easy_personal_keychain"
path = "src/keychain.rs"

# The default binary `easy-personal-rs` is `src/main.rs`. The connector launcher (T050) is a second, small one: Claude Code
# runs `easy-personal-launch exec <connector>`; it uses only the keychain library (and the core's `pyjson` text helpers).
[[bin]]
name = "easy-personal-rs"
path = "src/main.rs"

[[bin]]
name = "easy-personal-launch"
path = "src/launch.rs"

[dependencies]
easy-personal-core = { path = "../core" }
clap.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "sync", "time"] }
getrandom.workspace = true
rmcp.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
futures-core = "=0.3.34"
keyring = { version = "=3.6.3", default-features = false, features = ["async-secret-service", "tokio", "crypto-rust"] }
tauri = { workspace = true, optional = true }
# Desktop notifications (T074): the same zbus 4.4.0 that `keyring` already pulls in (default features, `tokio` through keyring); no new package in Cargo.lock.
zbus = "=4.4.0"

[build-dependencies]
tauri-build = { workspace = true, optional = true }

# In-process tests of the router (T014): `oneshot` and body collection. Same versions axum already pulls in.
[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
http-body-util = "=0.1.5"
